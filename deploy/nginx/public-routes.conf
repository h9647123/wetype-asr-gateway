# Include inside your EXISTING HTTPS/blog server {} block.
# If Cloudflare Tunnel targets HTTP, include these routes in that origin vhost too.
# Keep its existing root, TLS, blog, and /.well-known routes.
location = /v1 {
    access_log off;
    error_log /var/log/nginx/wetype-iat-error.log crit;
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
location = /v1/models {
    proxy_pass http://wetype_backend;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "no-store" always;
}
location = /v1/audio/transcriptions {
    client_max_body_size 26m;
    proxy_pass http://wetype_backend;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
location ^~ /v1/ { return 404; }
location = /api/asr {
    client_max_body_size 30m;
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    proxy_read_timeout 240s;
    add_header Cache-Control "no-store" always;
}
location = /api/search {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $http_host;
    add_header Cache-Control "no-store" always;
}
location = /console { return 404; }
location = /console-login { return 404; }
location ^~ /console-api/ { return 404; }
